name: Build WLED with Animated Staircase

on:
  push:
    branches: [main, feature/staircase-usermod]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32dev_staircase

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLED_ESP32_Staircase
          path: |
            build_output/firmware/*.bin
