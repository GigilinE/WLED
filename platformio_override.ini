[platformio]
default_envs = esp32dev_staircase

[env:esp32dev_staircase]
extends = env:esp32dev
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_Staircase\"
  -D DATA_PINS=16
  -D PIXEL_COUNTS=23
custom_usermods = ${env:esp32dev.custom_usermods} Animated_Staircase
lib_deps = ${esp32.lib_deps}
board_build.partitions = ${esp32.default_partitions}
